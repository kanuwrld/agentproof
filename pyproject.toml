[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.1.0"
description = "Deterministic regression checks for recorded AI automation outputs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kanu" }]
keywords = ["ai", "automation", "evaluation", "testing", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
agentproof = "agentproof.cli:main"

[project.urls]
Repository = "https://github.com/kanuwrld/agentproof"
Issues = "https://github.com/kanuwrld/agentproof/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
